<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aegis Pharma OS | Enterprise Intelligence & Regulatory Platform</title>
  
  <!-- Typography (Plus Jakarta Sans & JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Marked Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-primary: #06080F;
      --bg-surface: #0B101E;
      --bg-surface-elevated: #131A2E;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-prominent: rgba(41, 181, 232, 0.25);
      --border-active: #29B5E8;
      
      --snowflake-cyan: #29B5E8;
      --snowflake-glow: rgba(41, 181, 232, 0.15);
      --cortex-indigo: #6366F1;
      
      --pharma-emerald: #10B981;
      --pharma-warning: #F59E0B;
      --pharma-danger: #EF4444;
      --pharma-purple: #8B5CF6;
      
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --text-accent: #38BDF8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--snowflake-cyan); }

    /* Top Navigation Bar */
    header {
      background: rgba(6, 8, 15, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 28px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #29B5E8, #6366F1);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      color: white;
      box-shadow: 0 0 22px rgba(41, 181, 232, 0.45);
    }

    .brand-title-wrap {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #FFFFFF, #94A3B8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .brand-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: rgba(41, 181, 232, 0.12);
      color: var(--snowflake-cyan);
      border: 1px solid rgba(41, 181, 232, 0.35);
      padding: 3px 10px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      box-shadow: 0 0 12px rgba(41, 181, 232, 0.15);
    }

    .brand-badge .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--snowflake-cyan);
      box-shadow: 0 0 8px var(--snowflake-cyan);
      animation: pulseDot 2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .nav-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      gap: 4px;
    }

    .nav-tab-btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-tab-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-tab-btn.active {
      color: white;
      background: linear-gradient(135deg, rgba(41, 181, 232, 0.25), rgba(99, 102, 241, 0.25));
      border: 1px solid rgba(41, 181, 232, 0.4);
      box-shadow: 0 0 14px rgba(41, 181, 232, 0.2);
    }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 6px 14px;
      border-radius: 30px;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #F87171;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.25);
      color: white;
      border-color: #EF4444;
    }

    /* Main Container */
    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px 28px;
    }

    /* KPI Cards Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 18px;
      position: relative;
      overflow: hidden;
      transition: all 0.2s;
    }

    .kpi-card:hover {
      border-color: var(--border-prominent);
      transform: translateY(-2px);
    }

    .kpi-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .kpi-value {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.03em;
    }

    .kpi-delta {
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--pharma-emerald);
    }

    /* Strategic Takeaway Banner */
    .takeaway-banner {
      background: linear-gradient(135deg, rgba(41, 181, 232, 0.08), rgba(99, 102, 241, 0.08));
      border: 1px solid rgba(41, 181, 232, 0.25);
      border-radius: 10px;
      padding: 12px 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    /* Panels & Tables */
    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 22px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 800;
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .custom-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .custom-table th {
      text-align: left;
      padding: 10px 14px;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    .custom-table td {
      padding: 13px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
    }

    .custom-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-primary);
    }

    /* Tags & Badges */
    .tag {
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      display: inline-block;
    }

    .tag-emerald { background: rgba(16, 185, 129, 0.15); color: var(--pharma-emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
    .tag-amber { background: rgba(245, 158, 11, 0.15); color: var(--pharma-warning); border: 1px solid rgba(245, 158, 11, 0.3); }
    .tag-rose { background: rgba(239, 68, 68, 0.15); color: var(--pharma-danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    .tag-cyan { background: rgba(41, 181, 232, 0.15); color: var(--snowflake-cyan); border: 1px solid rgba(41, 181, 232, 0.3); }
    .tag-purple { background: rgba(139, 92, 246, 0.15); color: var(--pharma-purple); border: 1px solid rgba(139, 92, 246, 0.3); }

    /* Login Portal Styles */
    .login-container {
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-card-hero {
      text-align: center;
      max-width: 680px;
      margin-bottom: 40px;
    }

    .login-persona-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      width: 100%;
      margin-bottom: 30px;
    }

    .persona-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .persona-card:hover {
      border-color: var(--snowflake-cyan);
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(41, 181, 232, 0.12);
    }

    .persona-card.selected {
      border-color: var(--snowflake-cyan);
      background: linear-gradient(145deg, rgba(41, 181, 232, 0.12), rgba(99, 102, 241, 0.12));
      box-shadow: 0 0 25px rgba(41, 181, 232, 0.25);
    }

    /* Standalone Dedicated Chatbot Styles */
    .standalone-chat-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      height: 78vh;
      overflow: hidden;
    }

    .chat-header-bar {
      padding: 14px 24px;
      background: var(--bg-surface-elevated);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .chat-bubble {
      max-width: 85%;
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 13.5px;
      line-height: 1.6;
    }

    .chat-bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(41, 181, 232, 0.2), rgba(99, 102, 241, 0.2));
      border: 1px solid rgba(41, 181, 232, 0.4);
      color: white;
    }

    .chat-bubble.assistant {
      align-self: flex-start;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      width: 85%;
    }

    /* Multi-Mode Response Sub-Tabs */
    .response-mode-nav {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .response-mode-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .response-mode-btn:hover {
      color: white;
      background: rgba(255, 255, 255, 0.08);
    }

    .response-mode-btn.active {
      color: white;
      background: var(--snowflake-cyan);
      color: #000;
      border-color: var(--snowflake-cyan);
    }

    .chat-input-container {
      padding: 16px 24px;
      background: rgba(6, 8, 15, 0.8);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      gap: 12px;
    }

    .chat-input {
      flex: 1;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: white;
      padding: 14px 18px;
      border-radius: 9px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    .chat-input:focus {
      border-color: var(--snowflake-cyan);
    }

    .btn-send {
      background: linear-gradient(135deg, #29B5E8, #6366F1);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* RAG Document Explorer & File Renderer */
    .rag-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      min-height: 720px;
    }

    .rag-sidebar {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .rag-search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 14px;
    }

    .rag-search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }

    .rag-doc-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 580px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .rag-doc-item {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .rag-doc-item:hover {
      border-color: var(--border-prominent);
      transform: translateX(2px);
    }

    .rag-doc-item.active {
      background: linear-gradient(135deg, rgba(41, 181, 232, 0.12), rgba(99, 102, 241, 0.12));
      border: 1px solid var(--snowflake-cyan);
      box-shadow: 0 0 14px rgba(41, 181, 232, 0.15);
    }

    .rag-viewer-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .rag-viewer-header {
      background: var(--bg-surface-elevated);
      padding: 16px 22px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rag-section-pills {
      display: flex;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(6, 8, 15, 0.6);
      border-bottom: 1px solid var(--border-subtle);
      overflow-x: auto;
    }

    .rag-section-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 14px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }

    .rag-section-btn:hover {
      color: white;
      border-color: var(--snowflake-cyan);
      background: rgba(41, 181, 232, 0.12);
    }

    .rag-code-container {
      flex: 1;
      padding: 18px 22px;
      background: #04060B;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      line-height: 1.7;
      max-height: 600px;
      overflow-y: auto;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .rag-line {
      display: flex;
      gap: 16px;
      padding: 1px 0;
    }

    .rag-line:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .rag-line-num {
      width: 44px;
      text-align: right;
      color: var(--text-muted);
      user-select: none;
      flex-shrink: 0;
      font-size: 11px;
    }

    .rag-line-text {
      flex: 1;
      color: #E2E8F0;
    }

    .rag-line-text.warning-line {
      color: #F87171;
      font-weight: 600;
      background: rgba(239, 68, 68, 0.08);
      border-left: 2px solid #EF4444;
      padding-left: 4px;
    }

    .rag-line-text.section-line {
      color: #38BDF8;
      font-weight: 700;
      text-decoration: underline;
      padding-top: 6px;
    }

    .rag-line-text.highlight-line {
      background: rgba(245, 158, 11, 0.2);
      color: #FEF08A;
      border-radius: 3px;
      padding: 0 4px;
    }

    /* Markdown Rich Typography */
    .markdown-body {
      font-size: 13.5px;
      line-height: 1.65;
      color: #E2E8F0;
    }

    .markdown-body strong, .markdown-body b {
      color: #38BDF8;
      font-weight: 700;
    }

    .markdown-body em, .markdown-body i {
      color: #94A3B8;
      font-style: italic;
    }

    .markdown-body ul, .markdown-body ol {
      margin: 8px 0 12px 22px;
      padding: 0;
    }

    .markdown-body li {
      margin-bottom: 6px;
      line-height: 1.55;
    }

    .markdown-body li::marker {
      color: var(--snowflake-cyan);
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      color: #F8FAFC;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: 750;
      letter-spacing: -0.01em;
    }

    .markdown-body h4 {
      color: var(--snowflake-cyan);
      font-size: 13.5px;
    }

    .markdown-body h3 {
      font-size: 14.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 4px;
    }

    .markdown-body p {
      margin-bottom: 8px;
    }

    .markdown-body p:last-child {
      margin-bottom: 0;
    }

    .markdown-body code {
      background: rgba(255, 255, 255, 0.08);
      color: #38BDF8;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
    }

    .markdown-body blockquote {
      border-left: 3px solid var(--snowflake-cyan);
      padding-left: 12px;
      margin: 10px 0;
      color: var(--text-secondary);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="root"></div>

    // Rich Markdown Parser & Viewer Component
    function MarkdownViewer({ content }) {
      if (!content) return null;

      // 1. Primary: Use Marked library if available in window
      if (typeof marked !== 'undefined' && marked.parse) {
        try {
          const rawHtml = marked.parse(content, { gfm: true, breaks: true });
          return <div className="markdown-body" dangerouslySetInnerHTML={{ __html: rawHtml }} />;
        } catch (err) {
          console.warn("marked.parse fallback:", err);
        }
      }

      // 2. Resilient Native Regex Fallback Parser (renders bold **, italic *, lists *, headers ###)
      const renderFormatted = (text) => {
        const lines = text.split('\n');
        const elements = [];
        let inList = false;
        let listItems = [];

        const flushList = () => {
          if (listItems.length > 0) {
            elements.push(<ul key={`ul-${elements.length}`}>{listItems}</ul>);
            listItems = [];
            inList = false;
          }
        };

        const parseInline = (line) => {
          const parts = [];
          const regex = /(\*\*.*?\*\*|\*.*?\*|`.*?`)/g;
          let lastIdx = 0;
          let match;

          while ((match = regex.exec(line)) !== null) {
            if (match.index > lastIdx) {
              parts.push(line.substring(lastIdx, match.index));
            }
            const token = match[0];
            if (token.startsWith('**') && token.endsWith('**')) {
              parts.push(<strong key={match.index}>{token.slice(2, -2)}</strong>);
            } else if (token.startsWith('*') && token.endsWith('*')) {
              parts.push(<em key={match.index}>{token.slice(1, -1)}</em>);
            } else if (token.startsWith('`') && token.endsWith('`')) {
              parts.push(<code key={match.index}>{token.slice(1, -1)}</code>);
            }
            lastIdx = regex.lastIndex;
          }
          if (lastIdx < line.length) {
            parts.push(line.substring(lastIdx));
          }
          return parts.length > 0 ? parts : line;
        };

        lines.forEach((line, idx) => {
          const trimmed = line.trim();
          if (!trimmed) {
            flushList();
            elements.push(<div key={`sp-${idx}`} style={{ height: "6px" }} />);
            return;
          }

          // Bullet list (* or -)
          if (trimmed.startsWith('* ') || trimmed.startsWith('- ')) {
            inList = true;
            listItems.push(
              <li key={`li-${idx}`}>
                {parseInline(trimmed.substring(2))}
              </li>
            );
            return;
          }

          // Section headers
          if (trimmed.startsWith('### ')) {
            flushList();
            elements.push(
              <h4 key={`h4-${idx}`}>
                {parseInline(trimmed.substring(4))}
              </h4>
            );
            return;
          }

          if (trimmed.startsWith('## ')) {
            flushList();
            elements.push(
              <h3 key={`h3-${idx}`}>
                {parseInline(trimmed.substring(3))}
              </h3>
            );
            return;
          }

          flushList();
          elements.push(
            <p key={`p-${idx}`}>
              {parseInline(trimmed)}
            </p>
          );
        });

        flushList();
        return elements;
      };

      return <div className="markdown-body">{renderFormatted(content)}</div>;
    }

    // Chart Component for Rendering Interactive Graphs in Chat
    function BotChart({ graphData, chartId }) {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !graphData || typeof Chart === 'undefined') return;
        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }
        const ctx = canvasRef.current.getContext('2d');
        chartInstanceRef.current = new Chart(ctx, {
          type: graphData.type || 'bar',
          data: {
            labels: graphData.labels,
            datasets: graphData.datasets.map(ds => ({
              ...ds,
              borderWidth: ds.borderWidth || 1,
              borderRadius: 6
            }))
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: graphData.type === 'doughnut' || graphData.datasets.length > 1,
                labels: { color: '#94A3B8', font: { family: 'Plus Jakarta Sans', size: 11 } }
              },
              title: {
                display: !!graphData.title,
                text: graphData.title,
                color: '#F8FAFC',
                font: { family: 'Plus Jakarta Sans', size: 13, weight: '700' }
              }
            },
            scales: graphData.type === 'doughnut' ? {} : {
              x: { ticks: { color: '#64748B' }, grid: { color: 'rgba(255,255,255,0.05)' } },
              y: { ticks: { color: '#64748B' }, grid: { color: 'rgba(255,255,255,0.05)' } }
            }
          }
        });

        return () => {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
          }
        };
      }, [graphData]);

      return (
        <div style={{ height: "260px", width: "100%", position: "relative", marginTop: "12px", padding: "12px", background: "rgba(0,0,0,0.35)", borderRadius: "8px", border: "1px solid var(--border-subtle)" }}>
          <canvas ref={canvasRef} id={chartId}></canvas>
        </div>
      );
    }

                          onClick={() => setSelectedDocId(doc.id)}
                        >
                          <div style={{display: "flex", justifyContent: "space-between", marginBottom: "4px"}}>
                            <span className={`tag ${doc.badgeClass}`}>{doc.badge}</span>
                            <span style={{fontSize: "10px", color: "var(--text-muted)", fontFamily: "'JetBrains Mono', monospace"}}>{doc.filename.split('.').pop().toUpperCase()}</span>
                          </div>
                          <div style={{fontWeight: "700", fontSize: "13px", color: "white", marginBottom: "4px"}}>{doc.title}</div>
                          <div style={{fontSize: "11.5px", color: "var(--text-secondary)"}}>{doc.description}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Right Column: Line-Numbered Document Viewer */}
                <div className="rag-viewer-panel">
                  {(() => {
                    const activeDoc = ragDocs.find(d => d.id === selectedDocId) || ragDocs[0];
                    if (!activeDoc) return null;
                    return (
                      <React.Fragment>
                        <div className="rag-viewer-header">
                          <div>
                            <div style={{display: "flex", alignItems: "center", gap: "10px"}}>
                              <span className={`tag ${activeDoc.badgeClass}`}>{activeDoc.badge}</span>
                              <span style={{fontSize: "11px", color: "var(--text-muted)", fontFamily: "'JetBrains Mono', monospace"}}>{activeDoc.filename}</span>
                              <span className="tag tag-emerald"><i className="fa-solid fa-circle-check"></i> Snowflake Arctic Vector Verified</span>
                            </div>
                            <h3 style={{fontSize: "16px", fontWeight: "800", color: "white", marginTop: "6px"}}>{activeDoc.title}</h3>
                          </div>

                          <button 
                            type="button" 
                            onClick={() => {
                              const citation = `[FDA / SNOWFLAKE AUDIT] ${activeDoc.title} | Verified via snowflake-arctic-embed-l-v2.0 against AEGIS_CORTEX_DB.`;
                              navigator.clipboard.writeText(citation).then(() => {
                                setCitationCopied(true);
                                setTimeout(() => setCitationCopied(false), 2000);
                              });
                            }}
                            style={{background: citationCopied ? "var(--pharma-emerald)" : "var(--bg-surface)", border: "1px solid var(--border-subtle)", color: "white", fontSize: "12px", fontWeight: "600", padding: "8px 14px", borderRadius: "8px", cursor: "pointer"}}
                          >
                            <i className={`fa-solid ${citationCopied ? 'fa-check' : 'fa-quote-left'}`}></i> {citationCopied ? "Citation Copied!" : "Copy Citation"}
                          </button>
                        </div>

                        {activeDoc.sections && (
                          <div className="rag-section-pills">
                            <span style={{fontSize: "11px", color: "var(--text-muted)", alignSelf: "center", textTransform: "uppercase", fontWeight: "700"}}>Jump:</span>
                            {activeDoc.sections.map((sec, sIdx) => (
                              <button key={sIdx} className="rag-section-btn" onClick={() => handleJumpToSection(sec)}>{sec}</button>
                            ))}
                          </div>
                        )}

                        <div className="rag-code-container" ref={codeContainerRef}>
                          {docLoading ? (
                            <div style={{padding: "40px", textAlign: "center", color: "var(--text-muted)"}}>
                              <i className="fa-solid fa-circle-notch fa-spin"></i> Loading document from Snowflake...
                            </div>
                          ) : docContent && docContent.lines ? (
                            docContent.lines.map((l, lIdx) => {
                              const textUpper = l.text.toUpperCase();
                              const isWarning = textUpper.includes("WARNING:") || textUpper.includes("CONTRAINDICATION") || textUpper.includes("LACTIC ACIDOSIS") || textUpper.includes("BLEEDING RISK");
                              const isHeader = l.text.startsWith("#") || textUpper.startsWith("##") || (textUpper.match(/^[0-9]+\.\s/) && textUpper === textUpper);
                              let lineClass = "";
                              if (isWarning) lineClass = "warning-line";
                              else if (isHeader) lineClass = "section-line";

                              return (
                                <div key={lIdx} id={`rag-line-${l.line_num}`} className="rag-line">
                                  <div className="rag-line-num">{l.line_num}</div>
                                  <div className={`rag-line-text ${lineClass}`}>{l.text || "\u00A0"}</div>
                                </div>
                              );
                            })
                          ) : null}
                        </div>
                      </React.Fragment>
                    );
                  })()}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
