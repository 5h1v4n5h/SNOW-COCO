<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aegis Pharma Copilot | Enterprise Guardrailed Clinical Intelligence</title>
  
  <!-- Modern Typography (Plus Jakarta Sans & JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-primary: #07090E;
      --bg-surface: #0E131F;
      --bg-surface-elevated: #161D2E;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-prominent: rgba(41, 181, 232, 0.25);
      --border-active: #29B5E8;
      
      --snowflake-cyan: #29B5E8;
      --snowflake-glow: rgba(41, 181, 232, 0.15);
      --cortex-indigo: #6366F1;
      
      --pharma-emerald: #10B981;
      --pharma-warning: #F59E0B;
      --pharma-danger: #EF4444;
      --pharma-purple: #8B5CF6;
      
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --text-accent: #38BDF8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--snowflake-cyan); }

    /* Top Navigation Bar */
    header {
      background: rgba(7, 9, 14, 0.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 28px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #29B5E8, #6366F1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: white;
      box-shadow: 0 0 20px rgba(41, 181, 232, 0.4);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #FFFFFF, #94A3B8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: rgba(41, 181, 232, 0.12);
      color: var(--snowflake-cyan);
      border: 1px solid rgba(41, 181, 232, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: 8px;
    }

    .nav-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      gap: 4px;
    }

    .nav-tab-btn {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-tab-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-tab-btn.active {
      color: white;
      background: linear-gradient(135deg, rgba(41, 181, 232, 0.25), rgba(99, 102, 241, 0.25));
      border: 1px solid rgba(41, 181, 232, 0.4);
      box-shadow: 0 0 12px rgba(41, 181, 232, 0.2);
    }

    /* Account Switcher Header Component */
    .user-switcher-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 6px 14px;
      border-radius: 24px;
    }

    .user-select {
      background: transparent;
      color: white;
      border: none;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    .user-select option {
      background: var(--bg-surface-elevated);
      color: white;
    }

    /* Main Container */
    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px 28px;
    }

    /* KPI Cards Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 18px;
      position: relative;
      overflow: hidden;
      transition: all 0.2s;
    }

    .kpi-card:hover {
      border-color: var(--border-prominent);
      transform: translateY(-2px);
    }

    .kpi-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .kpi-value {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.03em;
    }

    .kpi-delta {
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .delta-pos { color: var(--pharma-emerald); }
    .delta-neg { color: var(--pharma-danger); }

    /* Content Panels */
    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 22px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Chatbot Layout */
    .chatbot-container {
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      gap: 20px;
      height: calc(100vh - 220px);
    }

    .chat-main {
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-bubble {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .chat-bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(41, 181, 232, 0.2), rgba(99, 102, 241, 0.2));
      border: 1px solid rgba(41, 181, 232, 0.4);
      color: white;
    }

    .chat-bubble.assistant {
      align-self: flex-start;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }

    .guardrail-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 14px;
      margin-bottom: 8px;
    }

    .chip-allowed { background: rgba(16, 185, 129, 0.15); color: var(--pharma-emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
    .chip-blocked { background: rgba(239, 68, 68, 0.15); color: var(--pharma-danger); border: 1px solid rgba(239, 68, 68, 0.4); }
    .chip-msl { background: rgba(139, 92, 246, 0.15); color: var(--pharma-purple); border: 1px solid rgba(139, 92, 246, 0.4); }

    .chat-input-bar {
      padding: 16px;
      background: rgba(7, 9, 14, 0.7);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      gap: 12px;
    }

    .chat-input {
      flex: 1;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: white;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    .chat-input:focus {
      border-color: var(--snowflake-cyan);
    }

    .btn-send {
      background: linear-gradient(135deg, #29B5E8, #6366F1);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Guardrail Telemetry Sidebar */
    .guardrail-sidebar {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .guardrail-metric {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      padding: 12px;
      border-radius: 8px;
    }

    .guardrail-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .guardrail-status-pill {
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Quick Test Action Buttons */
    .quick-test-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quick-test-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: white;
      border-color: var(--border-prominent);
    }

    /* Tables */
    .custom-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .custom-table th {
      text-align: left;
      padding: 10px 12px;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    .custom-table td {
      padding: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
    }

    .custom-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-primary);
    }

    .tag {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      display: inline-block;
    }

    .tag-emerald { background: rgba(16, 185, 129, 0.15); color: var(--pharma-emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
    .tag-amber { background: rgba(245, 158, 11, 0.15); color: var(--pharma-warning); border: 1px solid rgba(245, 158, 11, 0.3); }
    .tag-rose { background: rgba(239, 68, 68, 0.15); color: var(--pharma-danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    .tag-cyan { background: rgba(41, 181, 232, 0.15); color: var(--snowflake-cyan); border: 1px solid rgba(41, 181, 232, 0.3); }
    .tag-purple { background: rgba(139, 92, 246, 0.15); color: var(--pharma-purple); border: 1px solid rgba(139, 92, 246, 0.3); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 4 Distinct User Accounts with Strict Access Levels & Regulatory Scopes
    const ACCOUNTS = {
      sarah_rep: {
        id: "sarah_rep",
        name: "Sarah Jenkins",
        title: "Commercial Sales Representative (Midwest)",
        role: "COMMERCIAL_SALES_REP",
        color: "var(--snowflake-cyan)",
        badgeClass: "tag-cyan",
        icon: "fa-user-tie",
        scope: "Territory: TERR-MIDWEST-01 | Approved On-Label Detailing Only",
        guardrailSummary: "Strict OPDP 21 CFR § 202.1 Firewall. Off-label prompts are blocked & dispatched to MIR. HIPAA PII blocked."
      },
      dr_vance_msl: {
        id: "dr_vance_msl",
        name: "Dr. Eleanor Vance",
        title: "Medical Science Liaison (Medical Affairs)",
        role: "MSL_MEDICAL_AFFAIRS",
        color: "var(--pharma-purple)",
        badgeClass: "tag-purple",
        icon: "fa-user-doctor",
        scope: "National Medical Affairs | Unsolicited Inquiries & Clinical Trials",
        guardrailSummary: "Scientific Exchange Permitted. Allowed to review investigational & off-label clinical research. Strictly non-promotional."
      },
      david_market_access: {
        id: "david_market_access",
        name: "David Ross",
        title: "Regional Market Access Director",
        role: "MARKET_ACCESS_DIRECTOR",
        color: "var(--pharma-warning)",
        badgeClass: "tag-amber",
        icon: "fa-file-invoice-dollar",
        scope: "Payer Formularies, Prior Auth Diagnostics & Step-Therapy Recovery",
        guardrailSummary: "Formulary & Denials Access. Focus on X12 rejection codes (70, 75, 88) & copay abandonment economics."
      },
      marcus_cco: {
        id: "marcus_cco",
        name: "Marcus Vance",
        title: "Chief Commercial Officer (CCO)",
        role: "EXECUTIVE_CCO",
        color: "var(--pharma-emerald)",
        badgeClass: "tag-emerald",
        icon: "fa-building-columns",
        scope: "Enterprise Portfolio Health | National TRx/NRx & Budget Allocation",
        guardrailSummary: "Executive Macro Analytics. Strict CMS N >= 11 cell suppression enforced. No patient-level micro identifiers."
      }
    };

    // Public Synthea Volume Metrics
    const SYNTHEA_STATS = {
      realPatients: "1,171",
      realMedications: "42,989",
      realObservations: "299,697",
      realEncounters: "53,346",
      realProviders: "5,855",
      paRecoverable: "$142,800"
    };

    // Patient Inflection Trajectories
    const PATIENT_CASES = [
      {
        id: "PT-SYN-1042",
        name: "Arthur Pendelton (Synthea Cohort)",
        age: 68,
        conditions: "Type 2 Diabetes, Diabetic Nephropathy",
        activeMeds: "Metformin 1000mg BID, Glipizide 5mg",
        criticalEvent: "CRITICAL RENAL INFLECTION: eGFR dropped from 54 to 22 mL/min (CKD Stage 4).",
        hazard: "Lactic Acidosis Contraindication (FDA Boxed Warning)",
        actionRequired: "Halt Metformin immediately. Transition glycemic control to monitored insulin/SGLT2.",
        status: "Urgent Clinician Alert"
      },
      {
        id: "PT-SYN-2189",
        name: "Eleanor Vance (Synthea Cohort)",
        age: 72,
        conditions: "Atrial Fibrillation, Osteoarthritis",
        activeMeds: "Apixaban (Eliquis) 5mg BID, Ibuprofen 800mg TID",
        criticalEvent: "SEVERE DRUG-DRUG INTERACTION: High-dose oral NSAID + Direct Oral Anticoagulant.",
        hazard: "Major Gastrointestinal Hemorrhage Risk (Section 7.1)",
        actionRequired: "Discontinue oral NSAID. Switch analgesia to topical therapy.",
        status: "Pharmacovigilance Flag"
      },
      {
        id: "PT-SYN-3904",
        name: "Marcus Holloway (Synthea Cohort)",
        age: 49,
        conditions: "Severe Plaque Psoriasis (PASI 18)",
        activeMeds: "Prescribed Skyrizi (Risankizumab)",
        criticalEvent: "PRIOR AUTH REJECTION (Reject Code 70): Mandatory Step-Therapy Trial of Methotrexate.",
        hazard: "Script Abandonment & Therapy Non-Initiation",
        actionRequired: "Auto-Generate Prior Auth Appeal Packet documenting prior topical & DMARD failure.",
        status: "Appeal Packet Ready"
      }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(ACCOUNTS.sarah_rep);
      const [activeTab, setActiveTab] = useState("chatbot");
      const [messages, setMessages] = useState([
        {
          sender: "assistant",
          text: `Hello! I am your Enterprise Pharma Copilot powered natively by Snowflake Cortex AI.\nCurrently authenticated as ${ACCOUNTS.sarah_rep.name} (${ACCOUNTS.sarah_rep.title}).\nHow can I assist your field commercial detailing today?`,
          guardrails: { rbac: "PASS", pii: "PASS", opdp: "ACTIVE", fairBalance: "ENFORCED" }
        }
      ]);
      const [inputQuery, setInputQuery] = useState("");
      const [selectedCase, setSelectedCase] = useState(PATIENT_CASES[0]);
      const [appealGenerated, setAppealGenerated] = useState(false);
      const messagesEndRef = useRef(null);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages]);

      // Switch Account Handler
      const handleAccountSwitch = (userId) => {
        const user = ACCOUNTS[userId];
        setCurrentUser(user);
        setMessages(prev => [
          ...prev,
          {
            sender: "assistant",
            text: `🔄 Security Context Switched: Authenticated as ${user.name} (${user.title}).\n• Role: ${user.role}\n• Scope: ${user.scope}\n• Guardrail Policy: ${user.guardrailSummary}`,
            guardrails: { rbac: "SWITCHED", pii: "ACTIVE", opdp: user.role === "COMMERCIAL_SALES_REP" ? "STRICT_COMMERCIAL" : "PERMITTED_SCIENTIFIC", fairBalance: "ENFORCED" }
          }
        ]);
      };

      // Chat Submission Handler with Live Backend & Fail-safe Local Guardrail Engine
      const handleSend = async (queryToSend) => {
        const query = queryToSend || inputQuery;
        if (!query.trim()) return;

        const qLower = query.toLowerCase();
        const userMessage = { sender: "user", text: query };
        setMessages(prev => [...prev, userMessage]);
        if (!queryToSend) setInputQuery("");

        // Show thinking indicator
        const thinkingId = Date.now();
        setMessages(prev => [...prev, {
          id: thinkingId,
          sender: "assistant",
          text: "Evaluating access guardrails & synthesizing via Snowflake Cortex AI...",
          chip: "CORTEX REASONING",
          chipType: "allowed",
          isThinking: true
        }]);

        try {
          const res = await fetch('/api/copilot/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: currentUser.id, query: query })
          });
          if (res.ok) {
            const data = await res.json();
            setMessages(prev => prev.filter(m => m.id !== thinkingId).concat({
              sender: "assistant",
              chip: data.chip,
              chipType: data.chipType,
              text: data.text,
              guardrails: data.guardrails
            }));
            return;
          }
        } catch (err) {
          // Fall back gracefully to local zero-latency guardrail rule engine
        }

        // Local Rule Engine Fallback
        setTimeout(() => {
          let botResponse = {};

          // Check 1: PII Extraction attempt
          if (qLower.includes("ssn") || qLower.includes("address") || qLower.includes("mrn") || qLower.includes("phone")) {
            botResponse = {
              sender: "assistant",
              chip: "HIPAA SAFE HARBOR VIOLATION",
              chipType: "blocked",
              text: `🚫 GUARDRAIL HALT: Direct Protected Health Information (PHI) request detected.\nUnder HIPAA Safe Harbor (45 CFR § 164.514), individual patient identifiers (names, SSNs, street addresses, MRNs) cannot be returned in analytics or detailing queries.`,
              guardrails: { rbac: "DENIED", pii: "FAILED (BLOCKED)", opdp: "N/A", fairBalance: "N/A" }
            };
          }
          // Check 2: Off-label inquiry
          else if (qLower.includes("alopecia") || qLower.includes("pediatric") || qLower.includes("off-label") || qLower.includes("unapproved")) {
            if (currentUser.role === "COMMERCIAL_SALES_REP") {
              botResponse = {
                sender: "assistant",
                chip: "21 CFR § 202.1 OFF-LABEL FIREWALL",
                chipType: "blocked",
                text: `🚫 COMMERCIAL SALES FIREWALL INTERCEPTION:\nCommercial field representatives are legally prohibited from discussing or promoting unapproved indications or populations under FDA OPDP regulations.\n\n• Action: Query halted.\n• Compliance Protocol: An Unsolicited Medical Information Request (MIR) ticket #MIR-2026-${Math.floor(1000 + Math.random() * 9000)} has been created and securely dispatched to Medical Affairs for independent MSL handling.`,
                guardrails: { rbac: "PASS", pii: "PASS", opdp: "INTERCEPTED", fairBalance: "ENFORCED" }
              };
            } else if (currentUser.role === "MSL_MEDICAL_AFFAIRS") {
              botResponse = {
                sender: "assistant",
                chip: "MSL SCIENTIFIC EXCHANGE (NON-PROMOTIONAL)",
                chipType: "msl",
                text: `✅ MEDICAL AFFAIRS SCIENTIFIC EVIDENCE SYNTHESIS:\n[Investigational Non-Promotional Dialogue]\n\n• Target: IL-23 p19 pathway in off-label immune indications (e.g. Alopecia Areata / Vitiligo).\n• Clinical Dossier: Phase 2 exploratory cohort data indicates selective IL-23 inhibition suppresses scalp Th17 pathway cytokines, though primary hair-regrowth endpoints did not achieve statistical significance compared to JAK inhibitors.\n• Disclaimer: Risankizumab is not FDA approved for alopecia areata. This scientific dossier is provided exclusively for unsolicited medical inquiry evaluation.`,
                guardrails: { rbac: "PASS", pii: "PASS", opdp: "PERMITTED_SCIENTIFIC", fairBalance: "DISCLAIMER_ATTACHED" }
              };
            } else {
              botResponse = {
                sender: "assistant",
                chip: "REGULATORY AUDIT VIEW",
                chipType: "allowed",
                text: `Audit Notice: User ${currentUser.name} queried off-label keyword. Query monitored and logged in Snowflake APP.CLINICAL_ACTION_AUDIT_LOG without promotional generation.`,
                guardrails: { rbac: "PASS", pii: "PASS", opdp: "MONITORED", fairBalance: "PASS" }
              };
            }
          }
          // Check 3: Market Access / Prior Auth
          else if (qLower.includes("prior auth") || qLower.includes("appeal") || qLower.includes("denial") || qLower.includes("reject 70")) {
            botResponse = {
              sender: "assistant",

                  </table>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
